name: Benchmark (Linux, Large)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find previous successful run of this workflow
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const { data: current } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: current.workflow_id,
              branch: current.head_branch,
              status: 'success',
              per_page: 1,
            });
            const previous = data.workflow_runs.find(run => run.id !== context.runId);
            core.setOutput('sha', previous?.head_sha ?? '');

      - name: Check for changes outside benchmark results
        id: compare
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          if [[ -z "$PREVIOUS_SHA" ]]; then
            echo "No previous successful run; running benchmarks."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            echo "Previous commit is unavailable; running benchmarks."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            # Result commits must not cause another benchmark run.
            if git diff --quiet "$PREVIOUS_SHA" HEAD -- . ':(exclude)measurements/**'; then
              echo "No source changes since the previous successful run; skipping benchmarks."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              status=$?
              if [[ "$status" -ne 1 ]]; then exit "$status"; fi
              echo "Source changes found; running benchmarks."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  benchmark-linux-large:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Make all files executable
        run: chmod +x -R ./

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run k-perf benchmark
        shell: pwsh
        run: |
          Set-Location benchmarking/game-of-life-kmp-k-perf
          ./benchmark.ps1 -CleanBuild $false -RepetitionCount 50 -StepCount 500 `
            -Reference $true -Common $true -Dedicated $false `
            -JVM $true -JS $true -Native $true `
            -Enabled @($true) -FlushEarly @($true, $false) `
            -InstrumentPropertyAccessors @($true, $false) -TestKIR @($false) `
            -Methods @(".*", "step") -CILabel "ci-linux-large"

      - name: Commit and push benchmark results
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add measurements/
          $changes = git status --porcelain
          if ($changes) {
            git commit -m "Add benchmark results [linux-large] [skip ci]"
            $branch = $env:GITHUB_REF_NAME
            git checkout -- .
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              git pull --rebase origin $branch
              git push origin HEAD:refs/heads/$branch
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "Push attempt $attempt failed, retrying in $($attempt * 5)s..."
              Start-Sleep -Seconds ($attempt * 5)
            }
          } else {
            Write-Host "No benchmark results to commit."
          }
